[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "goduration"
version = "0.1.0"
description = "Human-friendly Go time.Duration compatibility for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Revolution1" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[dependency-groups]
test = ["pytest>=9.1.1"]
quality = ["pyright>=1.1.411", "ruff>=0.16.4"]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/goduration"]

[tool.hatch.build.targets.sdist]
include = ["src/goduration", "docs", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
