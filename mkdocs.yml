site_name: gotpl
site_description: Go-compatible text and HTML templates for Python
site_url: http://blog.kyonr.com/pygotpl/
repo_url: https://github.com/Revolution1/pygotpl
repo_name: Revolution1/pygotpl
copyright: Copyright &copy; 2026 Revolution1

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - packages/goduration/src
            - packages/gotime/src
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Template Language: template-language.md
      - Built-in Functions: builtin-functions.md
      - Async Rendering: async.md
      - HTML Templates: html.md
      - Function Libraries: function-libraries.md
      - Sandboxing: sandbox.md
      - Multi-file and Helm Integration: helm.md
      - Migration from Go: migration.md
  - API Reference:
      - API Overview: api.md
      - gotpl: reference/gotpl.md
      - Function Registries: reference/functions.md
      - goduration: reference/goduration.md
      - gotime: reference/gotime.md
  - Compatibility:
      - Compatibility Contract: compatibility.md
      - Performance: performance.md
      - Support Policy: support.md
  - Maintainers:
      - Architecture: architecture.md
      - API Design Review: reports/m10-api-design-review.md
      - Documentation Review: reports/m10-documentation-review.md
      - Testing: testing.md
      - Dependencies: dependencies.md
      - Reference Sources: references.md
      - Security of Sprig Profiles: sprig-security.md
      - Licensing: licensing.md
      - Releasing: releasing.md
      - Milestones: milestones/README.md

not_in_nav: |
  implementation-decisions.md
  extraction-candidates.md
  post-1.0.md
  upstream-test-map.md
  reports/**
  milestones/m*.md
