name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra all --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen --group docs mkdocs build --strict

  tests:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            tools/oracle/go.sum
            tools/sprig_oracle/go.sum
            tools/helm_oracle/go.sum
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra all --all-groups
      - name: Sync pinned upstream references
        shell: bash
        run: ./scripts/sync_references.sh
      - run: uv run --frozen coverage run -m pytest -q
      - run: uv run --frozen coverage report
      - run: uv run --frozen coverage json -o coverage-summary.json
      - run: uv run --frozen python scripts/check_coverage.py coverage-summary.json
      - name: Test workspace distributions from member directories
        shell: bash
        run: |
          for package in goduration gotime; do
            uv run --directory "packages/$package" --frozen pytest -q
          done
      - name: Build and smoke-test wheels on this interpreter
        run: uv run --frozen python scripts/check_wheel_matrix.py

  pypy:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    name: tests (ubuntu-latest, PyPy 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "pypy3.11"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            tools/oracle/go.sum
            tools/sprig_oracle/go.sum
            tools/helm_oracle/go.sum
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --python pypy3.11 --frozen --extra all --all-groups
      - name: Sync pinned upstream references
        run: ./scripts/sync_references.sh
      - run: uv run --python pypy3.11 --frozen coverage run -m pytest -q
      - run: uv run --python pypy3.11 --frozen coverage report
      - run: uv run --python pypy3.11 --frozen coverage json -o coverage-summary.json
      - run: uv run --python pypy3.11 --frozen python scripts/check_coverage.py coverage-summary.json
      - name: Test workspace distributions from member directories
        run: |
          for package in goduration gotime; do
            uv run --python pypy3.11 --directory "packages/$package" --frozen pytest -q
          done
      - name: Build and smoke-test wheels on PyPy
        run: uv run --python pypy3.11 --frozen python scripts/check_wheel_matrix.py

  go-oracle:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            tools/oracle/go.sum
            tools/sprig_oracle/go.sum
            tools/helm_oracle/go.sum
      - name: Sync pinned upstream references
        run: ./scripts/sync_references.sh
      - run: test -z "$(gofmt -l tools/oracle/main.go tools/oracle/sprout_inventory/main.go tools/sprig_oracle/main.go tools/helm_oracle/main.go tools/helm_oracle/benchmark_test.go tools/generate_regex_unicode/main.go tools/gofmt_oracle/main.go tools/goregexp_oracle/main.go benchmarks/go/main.go benchmarks/go/parser.go packages/goduration/tools/oracle/main.go packages/gotime/tools/oracle/main.go)"
      - run: ./scripts/check_generated.sh
      - run: ./scripts/check_goduration_oracle.sh
      - run: ./scripts/check_gofmt_oracle.sh
      - run: ./scripts/check_goregexp_oracle.sh
      - run: ./scripts/check_gotime_oracle.sh
      - run: ./scripts/check_sprout_inventory.sh
      - run: go -C tools/oracle test ./...
      - run: go -C tools/sprig_oracle test ./...
      - run: go -C tools/helm_oracle test ./...

  package:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --no-default-groups --group quality
      - run: uv build --all-packages
      - run: ./scripts/check_reproducible_builds.sh
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python --no-index --no-deps --find-links dist gotpl==0.1.0 goduration==0.1.0 gotime-py==0.1.0
      - run: uv pip install --python .package-venv/bin/python tzdata==2026.3 tzlocal==5.4.4
      - name: Smoke-test installed wheels without a compiler toolchain
        run: .package-venv/bin/python scripts/check_wheel_install.py
        env:
          PATH: ${{ github.workspace }}/.package-venv/bin
      - name: Type-check an isolated wheel consumer
        run: |
          cp scripts/wheel_typecheck.py "$RUNNER_TEMP/wheel_typecheck.py"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/pyright" --pythonpath "$GITHUB_WORKSPACE/.package-venv/bin/python" wheel_typecheck.py

  benchmark-smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python -m benchmarks.compare
      - run: uv run --frozen python -m benchmarks.helm_runtime --samples 1 --iterations 10 --memory-samples 1 --profile-iterations 1 --top 3
      - run: uv run --frozen python -m benchmarks.sandbox --iterations 10 --samples 1
