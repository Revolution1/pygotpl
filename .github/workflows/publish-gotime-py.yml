name: Publish gotime-py

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish gotime-py to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Build gotime-py
        run: uv build --package gotime-py --out-dir dist

      - name: Publish gotime-py
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
